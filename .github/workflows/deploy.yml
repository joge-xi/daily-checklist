name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 用提交 SHA 替换 sw.js 里的版本占位符，确保每次部署都能触发
      # Service Worker 更新与旧缓存清理。
      - name: Inject service worker build version
        run: sed -i "s/__BUILD_VERSION__/${{ github.sha }}/g" public/sw.js

      - name: Build
        run: bun run build

      # 静态导出下，把 index.html 复制为 404.html，让 /habits/[id] 等
      # 客户端路由在刷新时也能正确回退到 SPA 入口。
      - name: Enable SPA fallback
        run: cp out/index.html out/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
